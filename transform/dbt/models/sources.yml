version: 2

sources:
  - name: silver
    # database maps to the StarRocks external catalog name.
    # iceberg_catalog was registered via scripts/init-starrocks.sql.
    # StarRocks resolves {{ source('silver', 'orders') }} → iceberg_catalog.silver.orders
    # and reads the Parquet files directly from MinIO — no data is copied into StarRocks.
    database: iceberg_catalog
    schema: silver
    tables:
      - name: orders
      - name: order_items
      - name: customers
      - name: products
      - name: sellers
      - name: order_payments
      - name: order_reviews
