# Prometheus — chart: prometheus-community/prometheus  version: 25.21.0
#
# Prometheus is the metrics storage backend. It does NOT scrape components
# directly — the OTel Collector pushes metrics via remote write. This is
# a deliberate reversal of the traditional Prometheus pull model.
#
# Why push over pull?
#   Prometheus scrape requires each component to expose a /metrics HTTP
#   endpoint in Prometheus text format. JVM components (Kafka, Spark, Trino)
#   expose JMX metrics — not Prometheus format. The OTel Java agent translates
#   JMX → OTLP and the Collector translates OTLP → Prometheus remote write.
#   No per-component jmx_exporter sidecar needed.
#
# deploy:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus prometheus-community/prometheus \
#     --namespace observability \
#     --version 25.21.0 \
#     --values infrastructure/k8s/helm/values/prometheus.yaml \
#     --wait --timeout 5m

server:
  # Remote write endpoint must be enabled to accept pushes from OTel Collector
  remoteWriteDashboards: true
  retention: 7d
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  # Expose the remote write endpoint on /api/v1/write
  extraFlags:
    - web.enable-remote-write-receiver

# Disable components not needed for this push-based setup.
# Avoids deploying 4 extra pods for a local dev cluster.
kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

alertmanager:
  enabled: false
