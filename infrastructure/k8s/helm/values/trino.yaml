# Trino Helm values — chart: trinodb/trino  version: 0.29.0
#
# Trino is deployed temporarily alongside StarRocks to produce benchmark comparisons.
# It is removed after ADR-007 benchmark results are documented (make remove-trino).
#
# Memory sizing rule for Trino: maxMemoryPerNode + heapHeadroom <= JVM heap
#   JVM heap = 1G, headroom = 10% = 102MB, so maxMemoryPerNode = 700MB is safe.
#
# deploy:
#   helm repo add trinodb https://trinodb.github.io/charts
#   helm upgrade --install trino trinodb/trino \
#     --namespace serving \
#     --version 0.29.0 \
#     --values infrastructure/k8s/helm/values/trino.yaml \
#     --timeout 5m

image:
  tag: "435"

server:
  workers: 1
  config:
    query:
      maxMemory: "1GB"   # cluster-wide aggregate limit

coordinator:
  jvm:
    maxHeapSize: "1G"
  config:
    query:
      maxMemoryPerNode: "700MB"   # stays within 1G heap with 10% headroom (100MB)
    memory:
      heapHeadroomPerNode: "100MB"  # explicit headroom; default 30% (307MB) exceeds heap
  resources:
    requests:
      memory: "1.5Gi"
      cpu: "1"
    limits:
      memory: "2Gi"
      cpu: "1"

worker:
  jvm:
    maxHeapSize: "1G"
  config:
    query:
      maxMemoryPerNode: "700MB"
    memory:
      heapHeadroomPerNode: "100MB"
  resources:
    requests:
      memory: "1.5Gi"
      cpu: "1"
    limits:
      memory: "2Gi"
      cpu: "1"

# Iceberg connector — reads the same Silver tables as StarRocks.
# Both engines point at the same REST catalog and MinIO; no data duplication.
additionalCatalogs:
  lakehouse: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://iceberg-rest-catalog.infrastructure.svc.cluster.local:8181
    iceberg.rest-catalog.warehouse=s3://lakehouse-warehouse/
    fs.native-s3.enabled=true
    s3.region=us-east-1
    s3.endpoint=http://minio.infrastructure.svc.cluster.local:9000
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
    s3.path-style-access=true
    fs.cache.enabled=true
    fs.cache.max-size=2GB
    fs.cache.base-directory=/tmp/trino-cache

service:
  type: ClusterIP
  port: 8080
