# One-shot Job to create the Bronze Iceberg tables.
# Runs bronze_init_tables.py via spark-submit inside the bronze image.
# The job is idempotent — CREATE TABLE IF NOT EXISTS on every run.
#
# Re-run: kubectl delete job bronze-init-tables -n processing && kubectl apply -f ...
apiVersion: batch/v1
kind: Job
metadata:
  name: bronze-init-tables
  namespace: processing
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: registry.localhost:5000/spark-bronze:latest
          imagePullPolicy: Always
          command:
            - /opt/spark/bin/spark-submit
            - --master
            - local[2]
            - --conf
            - spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
            - /app/bronze_init_tables.py
          env:
            - name: ICEBERG_REST_URI
              value: "http://iceberg-rest-catalog.infrastructure.svc.cluster.local:8181"
            - name: S3_ENDPOINT
              value: "http://minio.infrastructure.svc.cluster.local:9000"
            - name: S3_ACCESS_KEY
              value: "minioadmin"
            - name: S3_SECRET_KEY
              value: "minioadmin"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
